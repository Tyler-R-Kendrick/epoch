name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # ubuntu-latest already ships Google Chrome. Use that browser so CI does not
  # depend on a second download from the Playwright CDN.
  PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome

jobs:
  # Fail-closed guard: the free-CI assumption below (standard GitHub-hosted
  # runners are free and unmetered) holds only while this repository stays
  # public. Every other job pins `runs-on: ubuntu-latest` literally, so a
  # `runs-on` edit is a reviewable diff to this file; this guard covers the
  # other half -- a visibility flip or an org transfer -- by failing instead
  # of silently running billed CI. See docs/ai-automation-strategy.md
  # Finding 1.
  guard:
    name: Guard — public repo
    runs-on: ubuntu-latest
    steps:
      - name: Verify repository is public
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "::error::Repository is private -- the standard-runner free-CI assumption this workflow relies on no longer holds. Failing closed. See docs/ai-automation-strategy.md Finding 1 before re-enabling." >&2
            exit 1
          fi

  docs:
    name: Docs
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Docs check
        run: npm run docs:check

  lint:
    name: Lint
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Community Web a11y lint
        run: npm run community-web:app:a11y-lint

  konsistent:
    name: Konsistent
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Konsistent
        run: npm run konsistent
        env:
          KONSISTENT_NO_UPDATE_CHECK: "true"

  design:
    name: Design
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Design.md lint
        run: npm run design:lint

      - name: Design token audit
        run: npm run design:audit

  typecheck:
    name: Typecheck
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --pretty false

  test:
    name: Test
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  coverage:
    name: Coverage
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Coverage
        run: npm run coverage

  pact:
    name: Pact
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pact contract tests
        run: npm run test:pact

  a11y-community-web:
    name: A11y — Community Web
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Duplicates the Build job's work rather than downloading its artifact.
      # A dedicated Build job above already gives build failures their own
      # attributable status check; this local build keeps this job
      # self-contained without adding artifact upload/download wiring across
      # ~20 workspaces' dist/ outputs. The rebuild is a few seconds.
      - name: Build
        run: npm run build -- --pretty false

      - name: Community Web accessibility gate
        run: npm run a11y:community-web

  community-web-app:
    name: Community Web app — a11y, faults, e2e
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Community Web app accessibility gate
        run: npm run community-web:app:a11y

      - name: Community Web app fault-injection suite
        run: npm run community-web:app:faults

      - name: Community Web app end-to-end suite
        run: npm run community-web:app:e2e

  nats-broker:
    name: NATS broker JWT
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install nats-server
        run: |
          curl -fsSL -o /tmp/nats-server.tgz https://github.com/nats-io/nats-server/releases/download/v2.10.26/nats-server-v2.10.26-linux-amd64.tar.gz
          tar -xzf /tmp/nats-server.tgz -C /tmp
          sudo install /tmp/nats-server-v2.10.26-linux-amd64/nats-server /usr/local/bin/nats-server
          nats-server -v

      - name: Build NATS package
        run: npm run build -w @epoch/protocol && npm run build -w @epoch/nats

      - name: Real-broker JWT tests
        run: node packages/Epoch.Nats/test/nats-server-jwt.integration.mjs

  xmpp-prosody:
    name: XMPP Prosody harness
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Prosody
        run: sudo apt-get update && sudo apt-get install -y prosody

      - name: Build protocol and XMPP packages
        run: npm run build -w @epoch/protocol && npm run build -w @epoch/xmpp

      - name: Prosody s2s harness
        run: node packages/Epoch.Xmpp/test/prosody-harness.mjs

  nats-mutants:
    name: NATS mutant kill
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Kill NATS discovery/ACL mutants
        run: npm run mutation:nats

  xmpp-mutants:
    name: XMPP mutant kill
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Kill XMPP admission/fanout mutants
        run: npm run mutation:xmpp

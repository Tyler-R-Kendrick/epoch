# TEMPORARILY DISABLED — save GitHub Actions runner minutes.
# Quality enforcement is local: `.githooks/*` + `npm run verify` (see AGENTS.md / DX.md).
# To re-enable CI later, restore:
#   on:
#     pull_request:
#     push:
#       branches: [main]
#
# Manual one-off runs remain available via Actions → "Quality Gates" → Run workflow.
name: Quality Gates

on:
  workflow_dispatch:

permissions:
  contents: read

# Safety net: even if someone re-adds push/PR triggers, jobs stay off until this is cleared.
env:
  EPOCH_CI_DISABLED: "1"

jobs:
  disabled:
    name: CI disabled (local gates only)
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "GitHub Actions quality jobs are temporarily disabled to conserve runner minutes."
          echo "Run locally: npm run gate:fast (commit) / npm run gate:push (push) / npm run verify (full)."
          echo "Hooks: git config core.hooksPath .githooks (wired by npm prepare)."

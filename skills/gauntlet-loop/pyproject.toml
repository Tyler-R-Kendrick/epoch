[project]
name = "gauntlet-loop"
version = "0.1.0"
description = "Deterministic control plane for spec-grounded, counterexample-driven improvement campaigns (gauntlet-loop Agent Skill)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Epoch contributors" }]
dependencies = [
    "activegraph~=1.10.0",
    "click>=8.1,<9",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "rfc8785>=0.1.4,<0.2",
    "cloudevents>=2.2,<3",
    "filelock>=3.13,<4",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.25,<2", "opentelemetry-sdk>=1.25,<2"]
stats = ["scipy>=1.11,<2", "numpy>=1.26,<3"]
postgres = ["activegraph[postgres]~=1.10.0"]
workflows = ["agent-framework-declarative>=1.0,<2"]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<8",
    "hypothesis>=6.100,<7",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "types-pyyaml>=6.0,<7",
]

[project.scripts]
gauntlet = "gauntlet.cli:main"

[project.entry-points."activegraph.packs"]
gauntlet = "gauntlet.activegraph_pack:build_pack"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/gauntlet"]

# Single-source the Agent Skill resources: references/ and assets/ live at the
# skill root for progressive disclosure, and ship inside the wheel under
# gauntlet/_bundled/ so the installed package is self-contained.
[tool.hatch.build.targets.wheel.force-include]
"references" = "gauntlet/_bundled/references"
"assets" = "gauntlet/_bundled/assets"
"SKILL.md" = "gauntlet/_bundled/SKILL.md"

[tool.hatch.build.targets.sdist]
include = [
    "scripts/gauntlet",
    "scripts/gauntlet.py",
    "references",
    "assets",
    "SKILL.md",
    "README.md",
    "THIRD_PARTY.md",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts"]
extend-exclude = ["assets", "references"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "RET", "SIM", "PTH"]
ignore = [
    "S101", # assert is fine in tests; production asserts are vetted case by case
]

[tool.ruff.lint.per-file-ignores]
"scripts/tests/**" = ["S", "B011"]

[tool.mypy]
strict = true
# Runtime floor is 3.11 (requires-python / ruff target py311). mypy targets
# 3.12 because numpy's bundled stubs use PEP 695 `type` statements that
# mypy refuses to parse under a 3.11 target.
python_version = "3.12"
mypy_path = "scripts"
packages = ["gauntlet"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["activegraph.*", "rfc8785.*", "cloudevents.*", "agent_framework.*", "scipy.*"]
ignore_missing_imports = true

# numpy's bundled stubs use PEP 695 `type` statements, which mypy refuses to
# parse under python_version 3.11. Runtime code never depends on numpy types
# crossing our module boundaries, so skipping its stubs is safe.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
addopts = "-q"
pythonpath = ["scripts"]

[tool.coverage.run]
source = ["gauntlet"]
branch = true

[tool.coverage.report]
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

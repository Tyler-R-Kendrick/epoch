# gauntlet project configuration (dev.gauntlet.project/v1)
#
# Generated by `gauntlet project init`. Paths are resolved against the Git
# root, never the process working directory. Local overrides belong in
# config.local.yaml (ignored); they may narrow policy or select local paths
# but may not raise authority without a tracked governance decision.

schema_version: dev.gauntlet.project/v1
project_id: ${GENERATED_PROJECT_UUID}
skill_contract: dev.gauntlet/v1

runtime:
  # ActiveGraph is the event-sourced runtime boundary.
  engine: activegraph
  store: .gauntlet/state/activegraph.sqlite3
  # Automatic authority ceiling. R2+ actions require approval; local
  # overrides may lower this, never raise it.
  authority_ceiling: R1
  # auto-sibling resolves to <repo-parent>/.<repo-name>.gauntlet-worktrees/
  worktree_root: auto-sibling
  lock_timeout_seconds: 30

artifacts:
  local_store: .gauntlet/artifacts/blobs
  digest_algorithm: sha256
  max_blob_bytes: 1073741824
  remote: null

telemetry:
  enabled: false
  exporter: none
  include_raw_content: false
  sample_ratio: 1.0

privacy:
  redact_by_default: true
  secret_environment_allowlist: []
  raw_trace_retention_days: 14

integrations:
  langsmith_cli: auto
  nemo_atof: auto
  oras_cli: auto
  cosign_cli: auto

defaults:
  profile: software
  non_interactive: false
  network_for_candidates: false

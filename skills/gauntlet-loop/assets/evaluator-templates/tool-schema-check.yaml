# Reusable command evaluator template (dev.gauntlet.evaluator/v1).
# Agent profile: validates the candidate workflow against the capability
# and tool-contract graph. Every referenced tool must exist, arguments
# must satisfy the tool's input schema, and no step may exceed the
# authority ceiling declared in policy-authority-config.

schema_version: dev.gauntlet.evaluator/v1
id: evaluator:tool-schema-check
kind: command
roles:
  - invariant-checker
independence: L4
command:
  argv: ["python", ".gauntlet/evaluators/checks/tool_schema_check.py"]
  cwd: candidate-worktree
  timeout_seconds: 300
  network: deny
  environment_allowlist: []
input_contract:
  artifacts:
    - candidate-workflow
    - capability-tool-graph
    - policy-authority-config
output_contract:
  format: dev.gauntlet.evaluator-output/v1
  result_file: .gauntlet-result.json
cost_class: bounded-local
frozen_for_promotion: true
version: 0.1.0

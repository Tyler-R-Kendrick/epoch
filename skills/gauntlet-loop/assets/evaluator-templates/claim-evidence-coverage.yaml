# Reusable command evaluator template (dev.gauntlet.evaluator/v1).
# Research profile: measures claim-to-evidence coverage over the claims
# graph. Sourced facts require at least one verified source; unresolved
# contradictions and claims with only negative evidence fail the gate;
# inference/speculation/recommendation labels must be present and honest.

schema_version: dev.gauntlet.evaluator/v1
id: evaluator:claim-evidence-coverage
kind: command
roles:
  - invariant-checker
  - comparator
independence: L4
command:
  argv: ["python", ".gauntlet/evaluators/checks/claim_evidence_coverage.py"]
  cwd: candidate-worktree
  timeout_seconds: 300
  network: deny
  environment_allowlist: []
input_contract:
  artifacts:
    - claims-graph
    - evidence-map
    - counterclaims
output_contract:
  format: dev.gauntlet.evaluator-output/v1
  result_file: .gauntlet-result.json
cost_class: bounded-local
frozen_for_promotion: true
version: 0.1.0

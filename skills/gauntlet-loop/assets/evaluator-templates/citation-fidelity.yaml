# Reusable command evaluator template (dev.gauntlet.evaluator/v1).
# Research profile: every citation in the ledger must resolve to a verified
# reference-pack entry, the quoted snippet must exist verbatim in the
# stored source digest, and no citation may point at another citation
# (citation laundering).

schema_version: dev.gauntlet.evaluator/v1
id: evaluator:citation-fidelity
kind: command
roles:
  - invariant-checker
independence: L4
command:
  argv: ["python", ".gauntlet/evaluators/checks/citation_fidelity.py"]
  cwd: candidate-worktree
  timeout_seconds: 300
  network: deny
  environment_allowlist: []
input_contract:
  artifacts:
    - citation-ledger
    - source-reference-pack
output_contract:
  format: dev.gauntlet.evaluator-output/v1
  result_file: .gauntlet-result.json
cost_class: bounded-local
frozen_for_promotion: true
version: 0.1.0

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nightboard — Epoch Civic Workshop</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Chrome for the garden panel itself. It is deliberately outside the theme
     contract: a theme must never be able to hide the controls that change it. */
</style>
</head>
<body data-theme="Nightboard">

<div class="nb-bar">
  <b>NIGHTBOARD</b>
  <select data-exp-select aria-label="Experience"></select>
  <select data-theme-select aria-label="Theme"></select>
  <button type="button" data-c="action" data-live-toggle>pause</button>
  <span class="nb-thesis" data-exp-thesis></span>
</div>

<div data-region="notice" hidden aria-live="polite"></div>
<main class="nb-mount" data-mount data-exp="graph" aria-label="Board"></main>
<footer data-region="status">
  <span data-status-line></span>
  <span style="margin-inline-start:auto"><b data-theme-name>Nightboard</b> · <span data-theme-note></span></span>
</footer>

<script src="data.js"></script>
<script src="sitemap.js"></script>
<script src="complete.js"></script>
<script src="resilient.js"></script>
<script src="agent.js"></script>
<script src="console.js"></script>
<script src="themes.js"></script>
<script src="app.js"></script>
<script src="openui-parser.js"></script>
<script src="openui-library.js"></script>
</body>
</html>
